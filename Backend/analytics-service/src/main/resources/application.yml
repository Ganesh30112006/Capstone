spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: analytics-service
  datasource:
    url: ${ANALYTICS_DB_URL:jdbc:postgresql://localhost:5432/analytics_db}
    username: ${ANALYTICS_DB_USERNAME:postgres}
    password: ${ANALYTICS_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
      max-lifetime: 1200000
      idle-timeout: 300000
  jpa:
    hibernate:
      # Flyway owns the schema; validate catches entity drift at startup.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 10s
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 20
        concurrency: 2
        max-concurrency: 8
        # Exhausted retries dead-letter rather than looping forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 10s
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 500ms

server:
  port: ${ANALYTICS_SERVICE_PORT:8084}
  shutdown: graceful

# Trust boundary: only requests proxied by the gateway carry this secret.
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:}
  enforce-origin: ${GATEWAY_ENFORCE_ORIGIN:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: analytics-service

analytics:
  heatmap:
    # Snapshots older than this are stale and excluded from the rendered heatmap.
    max-age-minutes: ${HEATMAP_MAX_AGE_MINUTES:120}
  trend:
    max-points: ${TREND_MAX_POINTS:288}

logging:
  level:
    root: INFO
    com.weatherplatform.analyticsservice: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: "dev"
  jpa:
    show-sql: true
logging:
  level:
    com.weatherplatform.analyticsservice: DEBUG
