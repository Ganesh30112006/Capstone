spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
      max-lifetime: 1200000
      idle-timeout: 300000
  jpa:
    hibernate:
      # Flyway owns the schema; validate catches entity drift at startup.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${AUTH_SERVICE_PORT:8083}
  shutdown: graceful

jwt:
  # Injected from the environment / AWS Secrets Manager. Deliberately has no
  # default: the service must fail to start rather than sign tokens with a
  # value an attacker could read in the source.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  issuer: ${JWT_ISSUER:smart-environmental-monitoring}

auth:
  # One-time administrator bootstrap. Self-registration only ever grants USER,
  # so without this there is no way to obtain the first admin account. Supplied
  # through the environment; never committed, never defaulted.
  bootstrap-admin:
    email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${AUTH_BOOTSTRAP_ADMIN_NAME:Platform Administrator}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: auth-service

logging:
  level:
    root: INFO
    com.weatherplatform.authservice: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: "dev"
  jpa:
    show-sql: true
logging:
  level:
    com.weatherplatform.authservice: DEBUG
